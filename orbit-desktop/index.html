<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self';" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Orbit</title>
    <link rel="stylesheet" href="style.css" />
    <script src="renderer.js" defer></script>
</head>

<body>
    <main>
        <div class="badge">LOCAL DESKTOP ASSISTANT</div>

        <h1>Less clicking.<br /><span>More doing.</span></h1>
        <p class="subtitle">Your apps, one command away.</p>

        <form id="command-form">
            <label class="sr-only" for="command">Enter a command</label>
            <input id="command" placeholder="Try “open notepad”" autocomplete="off" maxlength="200" />
            <button id="run" type="submit">Run ↗</button>
        </form>

        <div class="shortcuts">
            <button id="notepad" type="button">Notepad ↗</button>
            <button id="setup-ai" type="button">Install local AI</button>
        </div>

        <p id="status" role="status" aria-live="polite">
            Ready when you are.
        </p>
    </main>
</body>

</html>
