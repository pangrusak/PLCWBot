appId: com.srihaas.plcwbot
productName: PLCWBot

directories:
  output: release

asar: true

fileOptions:
  files:
    - main.js
    - preload.js
    - renderer.js
    - app-launcher.js
    - desktop-controls.js
    - index.html
    - style.css
    - package.json
    - app-config.json
    - logo.png

  extraResources:
    - from: setup-ai.ps1
      to: setup-ai.ps1

    - from: voice-command.ps1
      to: voice-command.ps1

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: logo.png

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: PLCWBot
  runAfterFinish: true